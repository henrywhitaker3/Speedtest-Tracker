#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27.3"
gotestsum = "1.13.0"
jq = "1.8.2"
git-cliff = "v2.14.2"

[tasks.dev]
description = "Bring up dev things"
run = "docker compose up -d jaeger"

[tasks.build-ui]
description = "Build the static UI served by the API"
dir = "frontend"
run = "mise exec -- pnpm build"
sources = [
  "app/**",
  "assets/**",
  "components/**",
  "layouts/**",
  "pages/**",
  "plugins/**",
  "public/**",
  "mise.toml",
  "nuxt.config.ts",
  "package.json",
  "pnpm-lock.yaml",
]
outputs = [".output/public/_nuxt/**"]

[tasks.serve]
description = "Run the app"
depends = ["dev"]
run = "APP_UI_DIR=frontend/.output/public go run main.go | jq"

[tasks.psk]
description = "Generate a runtime PSK"
run = "openssl rand -hex 32"

[tasks.queue]
description = "Queue a speedtest"
run = "curl -X POST -s http://localhost:8080/v1/speedtest/run | jq"

[tasks.test]
description = "Run the unit tests"
run = "gotestsum --format testname --packages ./..."

[tasks.release]
description = "Release a new version of the app"
shell = "/bin/bash"
run = "./hack/release.sh"
