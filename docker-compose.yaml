services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: speedtest-tracker
      POSTGRES_USER: speedtest-tracker
      POSTGRES_PASSWORD: speedtest-tracker
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U speedtest-tracker -d speedtest-tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: speedtest-tracker:latest
    hostname: speedtest-tracker
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 8080:8080
      - 8081:8081
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DB_URL: postgres://speedtest-tracker:speedtest-tracker@postgres:5432/speedtest-tracker?sslmode=disable

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP

  francis:
    image: ghcr.io/italypaleale/francis:0.2.1
    entrypoint: francis
    command: dashboard -bind 0.0.0.0
    ports:
      - 7402:7402

volumes:
  postgres:
