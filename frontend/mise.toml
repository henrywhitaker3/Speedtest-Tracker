#:schema https://mise.jdx.dev/schema/mise.json

[tools]
pnpm = "12.16.1"
node = "26.13.0"

[tasks.ui]
run = "pnpm run dev"

[tasks.client]
description = "Generate the api client"
run = "pnpm run client"

[tasks.build]
description = "Build the frontend"
run = "pnpm run build"

[tasks.lint]
run = "pnpm run lint"

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks.test-ui]
description = "Open the local"
run = "pnpm test:e2e:ui"

[tasks.test]
description = "Open the local"
run = "pnpm test:e2e"

[tasks.test-ci]
description = "Run the playwright tests in CI"
run = ["pnpm test:e2e:install", "pnpm test:e2e"]
